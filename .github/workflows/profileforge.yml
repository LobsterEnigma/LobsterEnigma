name: ProfileForge Pet

on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时一次，错开 stats 在 00:00 的那次
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profileforge.yml"]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# One run at a time, so visits never race each other.
concurrency:
  group: profileforge
  cancel-in-progress: false

jobs:
  pet:
    # Only comments in Lobster's house (never on pull requests) start a run.
    if: github.event_name != 'issue_comment' || (!github.event.issue.pull_request && startsWith(github.event.issue.title, 'ProfileForge:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: LobsterEnigma/ProfileForge@v1
        with:
          care: true
          care_issue: 2
          care_file: profile/care.json
          dirt: false
          outputs: |
            profile/pet.svg?name=Lobster&species=crab
            profile/city.svg?widget=city&species=crab
