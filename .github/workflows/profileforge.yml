name: ProfileForge Pet

on:
  schedule:
    - cron: "17 */6 * * *" # 每 6 小时一次，错开 stats 在 00:00 的那次
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profileforge.yml"]

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: LobsterEnigma/ProfileForge@v1
        with:
          outputs: |
            profile/pet.svg?name=Lobster&species=crab
            profile/city.svg?widget=city&species=crab
